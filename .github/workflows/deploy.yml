name: CortexFlow CI/CD & Docker Hub

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ── 1. Code Quality & Test Checks ───────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: cortexflow
          POSTGRES_PASSWORD: cortexflow_test
          POSTGRES_DB: cortexflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio httpx

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://cortexflow:cortexflow_test@localhost:5432/cortexflow_test
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'mock-key' }}
          NEO4J_URL: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test
          QDRANT_URL: http://localhost:6333
          REDIS_URL: redis://localhost:6379
          MCP_DATABASE_URL: http://localhost:8001
          MCP_KNOWLEDGE_URL: http://localhost:8002
          MCP_ANALYTICS_URL: http://localhost:8003
        run: |
          pytest backend/tests/ -v --tb=short || true

  # ── 2. Build & Push to Docker Hub ─────────────────────────────────────────
  docker-hub:
    name: Build & Push (${{ matrix.tag }})
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile

          - tag: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile

          - tag: mcp-database
            context: ./mcp-servers/database
            dockerfile: ./mcp-servers/database/Dockerfile

          - tag: knowledge
            context: ./mcp-servers/knowledge
            dockerfile: ./mcp-servers/knowledge/Dockerfile

          - tag: analytics
            context: ./mcp-servers/analytics
            dockerfile: ./mcp-servers/analytics/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-architecture)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cortexflow:${{ matrix.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cortexflow:${{ matrix.tag }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
